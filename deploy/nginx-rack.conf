server {
    listen 80;
    listen [::]:80;
    server_name rack.228311.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host:49173$request_uri;
    }
}

server {
    listen 49173 ssl;
    listen [::]:49173 ssl;
    server_name rack.228311.xyz;

    root /opt/cold-altitude-app;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/rack.228311.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rack.228311.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
