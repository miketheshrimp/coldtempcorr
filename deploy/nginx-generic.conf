# Generic nginx config for deploying this app on your own VPS.
# This file is an EXAMPLE, not a drop-in replacement for deploy/nginx-rack.conf.
# It lives on the friend-deploy branch only; it is not used by the main branch
# or by the author's own rack/tool deployment.
#
# HOW TO USE IT (replace every YOUR_ placeholder, nothing else is required):
#   1. On your VPS, clone the repo and copy the app files into place:
#        git clone https://github.com/miketheshrimp/coldtempcorr.git
#        sudo mkdir -p /opt/cold-altitude-app
#        sudo cp coldtempcorr/dist/* /opt/cold-altitude-app/
#   2. Point your domain's DNS A record at your VPS, then get a certificate:
#        sudo apt install nginx certbot python3-certbot-nginx
#        sudo certbot --nginx -d YOUR_DOMAIN
#      (certbot will write the certificate files below for you, or adjust the
#       ssl_certificate paths to match where your certificates actually are.)
#   3. Copy this file to /etc/nginx/sites-available/cold-altitude-app,
#      replace YOUR_DOMAIN and YOUR_PORT below, then:
#        sudo ln -s /etc/nginx/sites-available/cold-altitude-app \
#                   /etc/nginx/sites-enabled/cold-altitude-app
#        sudo nginx -t && sudo systemctl reload nginx
#   4. Open https://YOUR_DOMAIN:YOUR_PORT/ (or https://YOUR_DOMAIN/ if you
#      set YOUR_PORT to 443 and change the redirect below accordingly).
#
# NOTES:
#   - This app is pure static files: no backend, database, or API key is needed.
#   - The service worker requires HTTPS (or localhost) to work offline, so do
#     not serve it over plain HTTP in production.
#   - Keep the /sw.js no-cache rule below. Without it, browsers can keep
#     serving an old cached version after you deploy a new one.
#   - Do NOT run deploy/cold-altitude-app.service (python http.server) on the
#     same port as nginx at the same time; pick one way to serve the files.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host:YOUR_PORT$request_uri;
    }
}

server {
    # If you want the standard HTTPS port instead, change both lines below
    # to "listen 443 ssl;" and change the redirect above to
    # "return 301 https://$host$request_uri;".
    listen YOUR_PORT ssl;
    listen [::]:YOUR_PORT ssl;
    server_name YOUR_DOMAIN;

    root /opt/cold-altitude-app;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
